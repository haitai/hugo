<!-- https://tinytip.co/tips/html-pdf-params/ -->
{{ $pdf_url := .Get "src" }}
<object
    data="{{ $pdf_url }}"
    {{- with .Get "width" }} width="{{ . }}"{{ end -}}
    {{- with .Get "height" }} height="{{ . }}"{{ end -}}
    type="application/pdf"
>
    <p>无法显示 PDF 文件，请 <a href="{{ $pdf_url }}">下载</a> 查看。</p>
</object>
